# Full stack for staging-like local runs (Part 2 §12):
#   docker compose -f infra/docker-compose.yml up --build
# Postgres 16, Redis, MinIO (S3), API, Celery worker + beat, Next.js web.
# Provider keys come from apps/api/.env (fake providers are used for any key left empty).

name: karu

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: karu
      POSTGRES_PASSWORD: karu
      POSTGRES_DB: karu
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karu"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4.1
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: karu
      MINIO_ROOT_PASSWORD: karu-minio-secret
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 karu karu-minio-secret &&
             mc mb -p local/karu-private local/karu-public &&
             mc anonymous set download local/karu-public"

  api:
    build: ../apps/api
    env_file: [../apps/api/.env]
    environment: &api_env
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://karu:karu@postgres:5432/karu
      REDIS_URL: redis://redis:6379/0
      TASK_MODE: celery
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_PRIVATE: karu-private
      S3_BUCKET_PUBLIC: karu-public
      S3_ACCESS_KEY: karu
      S3_SECRET_KEY: karu-minio-secret
      CDN_BASE_URL: http://localhost:9000/karu-public
      API_BASE_URL: http://localhost:8000
      PUBLIC_BASE_URL: http://localhost:3000
      WEB_INTERNAL_URL: http://web:3000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["8000:8000"]

  worker:
    build: ../apps/api
    env_file: [../apps/api/.env]
    environment: *api_env
    command: celery -A app.workers.celery_app worker -Q ai,verification,pricing,media,notify,agents,default --concurrency 4 -l info
    depends_on: [api]

  beat:
    build: ../apps/api
    env_file: [../apps/api/.env]
    environment: *api_env
    command: celery -A app.workers.celery_app beat -l info
    depends_on: [api]

  web:
    build: ../apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata: {}
  miniodata: {}
